apiVersion: v1
kind: Namespace
metadata:
  name: cilock-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilock-webhook
  namespace: cilock-system
  labels:
    app: cilock-webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cilock-webhook
  template:
    metadata:
      labels:
        app: cilock-webhook
    spec:
      containers:
        - name: webhook
          image: cilock-k8s:dev
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --listen=:8443
            - --tls-cert=/etc/webhook/certs/tls.crt
            - --tls-key=/etc/webhook/certs/tls.key
            - --policy=/etc/cilock/config/policy.signed.json
            - --policy-key=/etc/cilock/config/policy-pub.pem
            - --attestation-dir=/etc/cilock/attestations
            - --registry-alias=localhost:{{REG_PORT}}={{REGISTRY_ADDR}}
            - --insecure-registry={{REGISTRY_ADDR}}
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
          volumeMounts:
            - name: certs
              mountPath: /etc/webhook/certs
              readOnly: true
            - name: config
              mountPath: /etc/cilock/config
              readOnly: true
            - name: attestations
              mountPath: /etc/cilock/attestations
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: cilock-webhook-tls
        - name: config
          configMap:
            name: cilock-config
        - name: attestations
          configMap:
            name: cilock-attestations
---
apiVersion: v1
kind: Service
metadata:
  name: cilock-webhook
  namespace: cilock-system
spec:
  selector:
    app: cilock-webhook
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: cilock-webhook
webhooks:
  - name: cilock-webhook.cilock-system.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 30
    clientConfig:
      service:
        name: cilock-webhook
        namespace: cilock-system
        path: /validate
      caBundle: "{{CA_BUNDLE}}"
    namespaceSelector:
      matchLabels:
        cilock-policy: enforce
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
